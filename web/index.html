<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChessMinds - C++20 Engine Interface</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #151f32;
      --surface-light: #223049;
      --border: #334460;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #22c55e;
      --danger: #ef4444;

      /* Sky & Sea Theme (Default) */
      --sq-light-base: #b9d7ea;
      --sq-light-grad: radial-gradient(circle at 35% 35%, #d4e9f7 0%, #b2d2e7 55%, #9bc2dc 100%);
      --sq-dark-base: #1b4d79;
      --sq-dark-grad: radial-gradient(circle at 65% 35%, #23659e 0%, #174872 60%, #113658 100%);
      --coord-light: #184670;
      --coord-dark: #c0ddf0;
      --sq-selected: rgba(56, 189, 248, 0.45);
      --sq-last-move: rgba(250, 204, 21, 0.35);
      --sq-dest-hint: rgba(34, 197, 94, 0.45);
    }

    /* Theme: Classic Wood */
    body.theme-classic-wood {
      --sq-light-base: #f0d9b5;
      --sq-light-grad: radial-gradient(circle at 35% 35%, #f8e8d0 0%, #eed5af 60%, #e5caa2 100%);
      --sq-dark-base: #b58863;
      --sq-dark-grad: radial-gradient(circle at 65% 35%, #c59771 0%, #ad7f5a 60%, #996c48 100%);
      --coord-light: #b58863;
      --coord-dark: #f0d9b5;
    }

    /* Theme: Emerald Green (Lichess/Chess.com style) */
    body.theme-emerald-green {
      --sq-light-base: #eaefd5;
      --sq-light-grad: radial-gradient(circle at 35% 35%, #f4f8e3 0%, #e6eccf 60%, #d8e0be 100%);
      --sq-dark-base: #759656;
      --sq-dark-grad: radial-gradient(circle at 65% 35%, #84a663 0%, #6e8e4f 60%, #5d7c3f 100%);
      --coord-light: #759656;
      --coord-dark: #eaefd5;
    }

    /* Theme: Charcoal Slate */
    body.theme-charcoal-slate {
      --sq-light-base: #cbd5e1;
      --sq-light-grad: radial-gradient(circle at 35% 35%, #e2e8f0 0%, #c4d0df 60%, #b3c2d3 100%);
      --sq-dark-base: #475569;
      --sq-dark-grad: radial-gradient(circle at 65% 35%, #56677f 0%, #404d5f 60%, #333e4e 100%);
      --coord-light: #475569;
      --coord-dark: #cbd5e1;
    }

    /* Theme: Midnight Cyber */
    body.theme-midnight-neon {
      --sq-light-base: #1e293b;
      --sq-light-grad: radial-gradient(circle at 35% 35%, #334155 0%, #1e293b 70%, #172132 100%);
      --sq-dark-base: #090e17;
      --sq-dark-grad: radial-gradient(circle at 65% 35%, #111a29 0%, #080d16 60%, #03060a 100%);
      --coord-light: #38bdf8;
      --coord-dark: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; color: var(--primary); }
    .badge { font-size: 0.75rem; background: var(--surface-light); color: var(--text-muted); padding: 2px 8px; border-radius: 9999px; }

    .main-container {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 28px;
      padding: 24px;
      max-width: 1350px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      align-items: start;
    }

    /* Chessboard with Vertical Evaluation Bar side by side */
    .board-area {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    /* Iconic Vertical Evaluation Bar */
    .vertical-eval-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 520px;
      width: 32px;
      position: relative;
    }

    .vertical-eval-bar {
      height: 100%;
      width: 24px;
      background: #111827; /* Black side (top) */
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid var(--border);
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .vertical-eval-fill {
      width: 100%;
      height: 50%; /* White side (bottom) */
      background: #f8fafc;
      transition: height 0.35s ease;
      box-shadow: 0 -2px 6px rgba(255,255,255,0.2);
    }

    .eval-badge {
      position: absolute;
      width: 100%;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -0.02em;
      pointer-events: none;
      z-index: 2;
    }
    .eval-badge.white-score {
      bottom: 6px;
      color: #0f172a;
    }
    .eval-badge.black-score {
      top: 6px;
      color: #f8fafc;
    }

    /* Board container */
    .board-container {
      position: relative;
      width: 520px;
      height: 520px;
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.6), 0 8px 12px -6px rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      overflow: hidden;
      border: 3px solid #1e293b;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      user-select: none;
    }

    .square {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .square.light {
      background-color: var(--sq-light-base);
      background-image: var(--sq-light-grad);
    }
    .square.dark {
      background-color: var(--sq-dark-base);
      background-image: var(--sq-dark-grad);
    }

    .square.selected { background: var(--sq-selected) !important; }
    .square.last-move { background: var(--sq-last-move) !important; }
    .square.check { background: rgba(239, 68, 68, 0.65) !important; }

    .hint-dot {
      width: 18px;
      height: 18px;
      background: var(--sq-dest-hint);
      border-radius: 50%;
      position: absolute;
      pointer-events: none;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
    }

    .hint-capture {
      width: 100%;
      height: 100%;
      border: 5px solid var(--sq-dest-hint);
      border-radius: 50%;
      position: absolute;
      pointer-events: none;
    }

    /* Piece Image with high definition rendering and shadow */
    .piece-img {
      width: 88%;
      height: 88%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
      transition: transform 0.1s ease;
    }

    /* Rank & File Coordinates */
    .coord {
      position: absolute;
      font-size: 11px;
      font-weight: 800;
      pointer-events: none;
      opacity: 0.9;
    }
    .coord-file { bottom: 2px; right: 4px; }
    .coord-rank { top: 2px; left: 4px; }
    .square.light .coord { color: var(--coord-light); }
    .square.dark .coord { color: var(--coord-dark); }

    /* Control panel & telemetry */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat-box {
      background: var(--surface-light);
      padding: 10px;
      border-radius: 6px;
    }

    .stat-label { font-size: 0.75rem; color: var(--text-muted); }
    .stat-val { font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-top: 2px; }

    /* Button and controls */
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    button, select {
      background: var(--surface-light);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover, select:hover { background: var(--primary); color: #000; border-color: var(--primary); }
    button.primary { background: var(--primary); color: #000; border-color: var(--primary); }
    button.primary:hover { background: var(--primary-hover); }

    select {
      outline: none;
      padding: 6px 12px;
    }

    /* Move notation box */
    .move-history {
      height: 130px;
      overflow-y: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 0.85rem;
      display: grid;
      grid-template-columns: 40px 1fr 1fr;
      row-gap: 4px;
      align-content: start;
    }

    .move-num { color: var(--text-muted); }
    .move-item { padding: 2px 6px; border-radius: 4px; cursor: pointer; }
    .move-item:hover { background: var(--surface-light); }
    .move-item.active { background: var(--primary); color: #000; font-weight: bold; }

    /* FEN bar */
    .fen-box {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 0.8rem;
      font-family: monospace;
    }

    .status-banner {
      padding: 8px 12px;
      background: var(--surface-light);
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .status-indicator.busy { background: #facc15; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

    /* Promotion dialog overlay */
    .promo-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .promo-dialog {
      background: var(--surface);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .promo-dialog h3 {
      font-size: 1rem;
      color: var(--primary);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .promo-choices {
      display: flex;
      gap: 10px;
    }
    .promo-choice {
      width: 64px;
      height: 64px;
      background: var(--surface-light);
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .promo-choice:hover {
      border-color: var(--primary);
      background: var(--primary);
      transform: scale(1.1);
    }
    .promo-choice img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }

    /* Drag ghost piece */
    .drag-ghost {
      position: fixed;
      width: 65px;
      height: 65px;
      pointer-events: none;
      z-index: 999;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
      transform: translate(-50%, -50%);
    }

    /* Piece move animation */
    .piece-img.animating {
      transition: transform 0.18s ease-out;
    }

    /* Square dragging states */
    .square.drag-from {
      opacity: 0.45;
    }
    .square.drag-over {
      outline: 3px solid var(--primary);
      outline-offset: -3px;
    }

    /* Game result banner */
    .game-result-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(11, 17, 32, 0.92);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 18px 32px;
      z-index: 100;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
    }
    .game-result-banner h2 {
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .game-result-banner p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body class="theme-sky-sea">

<header>
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M19 22H5V20H19V22M17 18H7V17L9 14V11C9 9.34 10.34 8 12 8S15 9.34 15 11V14L17 17V18M13 3H11V5H9V7H15V5H13V3Z"/>
    </svg>
    ChessMinds
    <span class="badge">C++20 Engine</span>
  </div>

  <!-- Theme selector right in header -->
  <div style="display: flex; align-items: center; gap: 12px;">
    <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Theme:</span>
    <select id="themeSelect" onchange="changeTheme(this.value)">
      <option value="theme-sky-sea" selected>Sky & Sea (Ocean)</option>
      <option value="theme-classic-wood">Classic Wood</option>
      <option value="theme-emerald-green">Emerald Green</option>
      <option value="theme-charcoal-slate">Charcoal Slate</option>
      <option value="theme-midnight-neon">Midnight Cyber</option>
    </select>

    <div class="status-banner">
      <div id="engineStatusDot" class="status-indicator"></div>
      <span id="engineStatusText">Engine Ready</span>
    </div>
  </div>
</header>

<div class="main-container">
  <!-- Left: Vertical Eval Bar + Chessboard + Controls -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <!-- Evaluation display right above and next to board -->
    <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 6px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 0.75rem; font-weight: 800; letter-spacing: 0.05em; color: var(--text-muted); text-transform: uppercase;">Evaluation</span>
        <span id="boardEvalScorePill" style="font-family: monospace; font-size: 1rem; font-weight: 800; padding: 2px 10px; border-radius: 4px; background: var(--surface-light); color: var(--accent);">+0.00</span>
      </div>
      <span id="boardEvalAdvantage" style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">Equal position</span>
    </div>

    <div class="board-area">
      <!-- Vertical Evaluation Bar beside board (like Lichess/Chess.com) -->
      <div class="vertical-eval-wrapper" title="Evaluation Bar">
        <div class="vertical-eval-bar">
          <div id="evalBadgeBlack" class="eval-badge black-score"></div>
          <div id="evalBarFill" class="vertical-eval-fill"></div>
          <div id="evalBadgeWhite" class="eval-badge white-score">+0.0</div>
        </div>
      </div>

      <!-- Main Chessboard -->
      <div class="board-container" id="chessboard"></div>
    </div>

    <!-- Navigation & board buttons -->
    <div class="btn-group" style="width: 100%; justify-content: center; margin-top: 4px;">
      <button onclick="navFirst()" title="First Move">&lt;&lt;</button>
      <button onclick="navPrev()" title="Previous Move">&lt;</button>
      <button onclick="navNext()" title="Next Move">&gt;</button>
      <button onclick="navLast()" title="Latest Move">&gt;&gt;</button>
      <button onclick="toggleFlip()" title="Flip Board">Flip</button>
      <button onclick="newGame()" class="primary">New Game</button>
    </div>
  </div>

  <!-- Right: Engine Telemetry & Controls -->
  <div class="sidebar">
    <!-- Live Engine Evaluation & Stats -->
    <div class="card">
      <div class="card-title">
        <span>Engine Telemetry</span>
        <span id="turnIndicator" style="color: var(--primary);">White to Move</span>
      </div>

      <div class="telemetry-grid">
        <div class="stat-box">
          <div class="stat-label">Evaluation Score</div>
          <div id="statEvalScore" class="stat-val" style="color: var(--accent);">+0.00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Search Depth</div>
          <div id="statDepth" class="stat-val">-</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Nodes / Sec</div>
          <div id="statNps" class="stat-val">-</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Engine Best Move</div>
          <div id="statBestMove" class="stat-val" style="color: var(--accent);">-</div>
        </div>
      </div>

      <div style="margin-top: 12px; font-size: 0.8rem; color: var(--text-muted); background: var(--bg); padding: 8px; border-radius: 6px; border: 1px solid var(--border);">
        <strong>Engine Line (PV):</strong>
        <span id="statPv" style="font-family: monospace; color: var(--text);">None</span>
      </div>
    </div>

    <!-- Engine Play Controls -->
    <div class="card">
      <div class="card-title">Engine Play Options</div>
      <div class="btn-group">
        <button id="btnEngineMove" onclick="requestEngineMove(true)" class="primary">Play Engine Move</button>
        <button onclick="undoMove()">Takeback</button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 0.85rem;">
        <input type="checkbox" id="chkAutoEngine" checked>
        <label for="chkAutoEngine">Auto-reply with ChessMinds as Black</label>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
        <span class="stat-label">Search Depth:</span>
        <input type="range" id="rngDepth" min="1" max="10" value="6" oninput="updateDepthLabel()" style="flex:1;">
        <span id="lblDepth" style="font-weight: bold; width: 20px;">6</span>
      </div>
    </div>

    <!-- Move History Notation -->
    <div class="card">
      <div class="card-title">Move Notation</div>
      <div class="move-history" id="moveHistory"></div>
    </div>

    <!-- FEN Control -->
    <div class="card">
      <div class="card-title">Position (FEN)</div>
      <div class="fen-box">
        <input type="text" id="fenInput" readonly>
        <button onclick="copyFen()">Copy</button>
      </div>
    </div>
  </div>
</div>

<script>
  // High-Resolution Custom Piece Images added by user in /public/
  const PIECE_IMAGES = {
    'P': '/public/wp.png',
    'N': '/public/wN.png',
    'B': '/public/wB.png',
    'R': '/public/wR.png',
    'Q': '/public/wQ.png',
    'K': '/public/wK.png',
    'p': '/public/bp.png',
    'n': '/public/bN.png',
    'b': '/public/bB.png',
    'r': '/public/bR.png',
    'q': '/public/bQ.png',
    'k': '/public/bK.png'
  };

  // Web Audio synthesizer for moves
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'move') {
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'capture') {
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.12);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    }
  }

  // Board State
  let board = [];
  let isFlipped = false;
  let selectedSq = null;
  let moveHistory = [];
  let historyPly = 0;
  let sideToMove = 'w';
  let lastMove = null;
  let enPassantSq = null; // tracks the en passant target square (e.g. "e3")
  let gameOver = false;
  let legalMoves = []; // populated by engine for hint dots
  let pendingPromoFrom = null;
  let pendingPromoTo = null;

  // Drag state
  let dragPiece = null;
  let dragFromSq = null;
  let dragGhost = null;

  function initBoard() {
    board = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];
    sideToMove = 'w';
    moveHistory = [];
    historyPly = 0;
    lastMove = null;
    selectedSq = null;
    enPassantSq = null;
    gameOver = false;
    legalMoves = [];
    pendingPromoFrom = null;
    pendingPromoTo = null;
    renderBoard();
    updateMoveHistoryUI();
    updateFenUI();
    updateEvalBar(0);
    document.getElementById("turnIndicator").innerText = "White to Move";
    fetchLegalMoves();
  }

  function changeTheme(themeClass) {
    document.body.className = themeClass;
  }

  function updateEvalBar(cp) {
    // Sigmoid curve to scale -10 to +10 pawns into 5% to 95%
    let pct = 50;
    let scoreDisplay = "0.0";

    if (Math.abs(cp) >= 29000) {
      // Checkmate score
      const mateIn = 30000 - Math.abs(cp);
      scoreDisplay = (cp > 0 ? "+M" : "-M") + Math.max(1, mateIn);
      pct = cp > 0 ? 98 : 2;
    } else {
      const pawns = cp / 100;
      scoreDisplay = (pawns > 0 ? "+" : "") + pawns.toFixed(1);
      // Smooth sigmoid curve
      pct = 1 / (1 + Math.pow(10, -cp / 400)) * 100;
      pct = Math.min(Math.max(pct, 5), 95);
    }

    const fillElem = document.getElementById("evalBarFill");
    const badgeWhite = document.getElementById("evalBadgeWhite");
    const badgeBlack = document.getElementById("evalBadgeBlack");
    const statScore = document.getElementById("statEvalScore");

    statScore.innerText = scoreDisplay;

    const boardPill = document.getElementById("boardEvalScorePill");
    const boardAdv = document.getElementById("boardEvalAdvantage");
    if (boardPill) boardPill.innerText = scoreDisplay;
    if (boardAdv) {
      if (Math.abs(cp) >= 29000) {
        boardAdv.innerText = cp > 0 ? "White has forced mate" : "Black has forced mate";
      } else if (cp > 150) {
        boardAdv.innerText = `White is winning (${scoreDisplay})`;
      } else if (cp > 40) {
        boardAdv.innerText = `White is better (${scoreDisplay})`;
      } else if (cp < -150) {
        boardAdv.innerText = `Black is winning (${scoreDisplay})`;
      } else if (cp < -40) {
        boardAdv.innerText = `Black is better (${scoreDisplay})`;
      } else {
        boardAdv.innerText = "Equal position (0.0)";
      }
    }

    if (isFlipped) {
      fillElem.style.height = (100 - pct) + "%";
      if (pct > 50) {
        badgeBlack.innerText = scoreDisplay;
        badgeWhite.innerText = "";
      } else {
        badgeWhite.innerText = scoreDisplay;
        badgeBlack.innerText = "";
      }
    } else {
      fillElem.style.height = pct + "%";
      if (pct >= 50) {
        badgeWhite.innerText = scoreDisplay;
        badgeBlack.innerText = "";
      } else {
        badgeBlack.innerText = scoreDisplay;
        badgeWhite.innerText = "";
      }
    }
  }

  function renderBoard() {
    const container = document.getElementById("chessboard");
    container.innerHTML = "";

    // Remove any existing game result banner
    const existingBanner = container.parentElement.querySelector('.game-result-banner');
    if (existingBanner) existingBanner.remove();

    for (let r = 0; r < 8; ++r) {
      for (let f = 0; f < 8; ++f) {
        const row = isFlipped ? 7 - r : r;
        const col = isFlipped ? 7 - f : f;
        const sqName = String.fromCharCode(97 + col) + (8 - row);
        const isLight = (row + col) % 2 === 0;

        const sqDiv = document.createElement("div");
        sqDiv.className = `square ${isLight ? 'light' : 'dark'}`;
        sqDiv.dataset.square = sqName;
        sqDiv.dataset.row = row;
        sqDiv.dataset.col = col;

        if (selectedSq === sqName) sqDiv.classList.add("selected");
        if (lastMove && (lastMove.from === sqName || lastMove.to === sqName)) sqDiv.classList.add("last-move");
        if (dragFromSq === sqName) sqDiv.classList.add("drag-from");

        // Coordinates
        if ((!isFlipped && row === 7) || (isFlipped && row === 0)) {
          const fileLabel = document.createElement("span");
          fileLabel.className = "coord coord-file";
          fileLabel.innerText = String.fromCharCode(97 + col);
          sqDiv.appendChild(fileLabel);
        }
        if ((!isFlipped && col === 0) || (isFlipped && col === 7)) {
          const rankLabel = document.createElement("span");
          rankLabel.className = "coord coord-rank";
          rankLabel.innerText = (8 - row);
          sqDiv.appendChild(rankLabel);
        }

        const piece = board[row][col];
        if (piece && PIECE_IMAGES[piece]) {
          const img = document.createElement("img");
          img.className = "piece-img";
          img.src = PIECE_IMAGES[piece];
          img.alt = piece;
          img.draggable = false;
          sqDiv.appendChild(img);
        }

        // Legal move hint dots (when a piece is selected)
        if (selectedSq && selectedSq !== sqName) {
          const uciCandidate = selectedSq + sqName;
          const isLegalDest = legalMoves.some(m => m.startsWith(uciCandidate));
          if (isLegalDest) {
            if (piece) {
              // Capture ring
              const ring = document.createElement("div");
              ring.className = "hint-capture";
              sqDiv.appendChild(ring);
            } else {
              // Empty destination dot
              const dot = document.createElement("div");
              dot.className = "hint-dot";
              sqDiv.appendChild(dot);
            }
          }
        }

        // Click handler
        sqDiv.addEventListener("click", () => handleSquareClick(sqName, row, col));

        // Drag-and-drop handlers
        sqDiv.addEventListener("mousedown", (e) => handleDragStart(e, sqName, row, col));

        container.appendChild(sqDiv);
      }
    }
  }

  // --- Drag-and-Drop ---
  function handleDragStart(e, sqName, r, c) {
    if (gameOver) return;
    const piece = board[r][c];
    if (!piece) return;
    const isWhitePiece = piece === piece.toUpperCase();
    if ((sideToMove === 'w' && !isWhitePiece) || (sideToMove === 'b' && isWhitePiece)) return;

    e.preventDefault();
    dragPiece = piece;
    dragFromSq = sqName;
    selectedSq = sqName;

    // Fetch legal moves for this position
    fetchLegalMoves();

    // Create ghost piece
    dragGhost = document.createElement("img");
    dragGhost.className = "drag-ghost";
    dragGhost.src = PIECE_IMAGES[piece];
    dragGhost.style.left = e.clientX + "px";
    dragGhost.style.top = e.clientY + "px";
    document.body.appendChild(dragGhost);

    renderBoard();

    document.addEventListener("mousemove", handleDragMove);
    document.addEventListener("mouseup", handleDragEnd);
  }

  function handleDragMove(e) {
    if (!dragGhost) return;
    dragGhost.style.left = e.clientX + "px";
    dragGhost.style.top = e.clientY + "px";
  }

  function handleDragEnd(e) {
    document.removeEventListener("mousemove", handleDragMove);
    document.removeEventListener("mouseup", handleDragEnd);

    if (dragGhost) {
      dragGhost.remove();
      dragGhost = null;
    }

    if (!dragFromSq) return;

    // Find the square under cursor
    const elem = document.elementFromPoint(e.clientX, e.clientY);
    const sqElem = elem ? elem.closest('.square') : null;
    const toSq = sqElem ? sqElem.dataset.square : null;

    if (toSq && toSq !== dragFromSq) {
      const fromSq = dragFromSq;
      const uciBase = fromSq + toSq;
      dragFromSq = null;
      dragPiece = null;

      // Validate legality against engine legal moves
      const matchingLegalMoves = legalMoves.filter(m => m.startsWith(uciBase));
      if (matchingLegalMoves.length === 0) {
        selectedSq = null;
        renderBoard();
        return;
      }

      // Check if promotion
      const fromRow = 8 - parseInt(fromSq[1]);
      const toRow = 8 - parseInt(toSq[1]);
      const movingPiece = board[fromRow][fromSq.charCodeAt(0) - 97];

      if (movingPiece === 'P' && toRow === 0) {
        showPromotionDialog(fromSq, toSq, 'w');
        return;
      }
      if (movingPiece === 'p' && toRow === 7) {
        showPromotionDialog(fromSq, toSq, 'b');
        return;
      }

      applyMove(uciBase);
      selectedSq = null;
    } else {
      dragFromSq = null;
      dragPiece = null;
    }

    renderBoard();
  }

  function handleSquareClick(sqName, r, c) {
    if (gameOver) return;
    if (!selectedSq) {
      const piece = board[r][c];
      if (!piece) return;
      const isWhitePiece = piece === piece.toUpperCase();
      if ((sideToMove === 'w' && !isWhitePiece) || (sideToMove === 'b' && isWhitePiece)) return;

      selectedSq = sqName;
      fetchLegalMoves();
      renderBoard();
    } else {
      if (selectedSq === sqName) {
        selectedSq = null;
        legalMoves = [];
        renderBoard();
        return;
      }

      // Check if clicking own piece to re-select
      const clickedPiece = board[r][c];
      if (clickedPiece) {
        const isWhiteClicked = clickedPiece === clickedPiece.toUpperCase();
        if ((sideToMove === 'w' && isWhiteClicked) || (sideToMove === 'b' && !isWhiteClicked)) {
          selectedSq = sqName;
          fetchLegalMoves();
          renderBoard();
          return;
        }
      }

      const fromSq = selectedSq;
      const toSq = sqName;
      const uciBase = fromSq + toSq;

      // Validate legality against engine legal moves
      const matchingLegalMoves = legalMoves.filter(m => m.startsWith(uciBase));
      if (matchingLegalMoves.length === 0) {
        // Not a legal move: deselect and abort
        selectedSq = null;
        renderBoard();
        return;
      }

      // Check if promotion
      const fromRow = 8 - parseInt(fromSq[1]);
      const toRow = 8 - parseInt(toSq[1]);
      const movingPiece = board[fromRow][fromSq.charCodeAt(0) - 97];

      if (movingPiece === 'P' && toRow === 0) {
        showPromotionDialog(fromSq, toSq, 'w');
        return;
      }
      if (movingPiece === 'p' && toRow === 7) {
        showPromotionDialog(fromSq, toSq, 'b');
        return;
      }

      applyMove(uciBase);
      selectedSq = null;
    }
  }

  // --- Promotion Dialog ---
  function showPromotionDialog(fromSq, toSq, color) {
    pendingPromoFrom = fromSq;
    pendingPromoTo = toSq;

    const overlay = document.createElement("div");
    overlay.className = "promo-overlay";
    overlay.id = "promoOverlay";

    const dialog = document.createElement("div");
    dialog.className = "promo-dialog";

    const title = document.createElement("h3");
    title.innerText = "Promote Pawn To:";
    dialog.appendChild(title);

    const choices = document.createElement("div");
    choices.className = "promo-choices";

    const pieces = color === 'w'
      ? [['Q', 'Queen'], ['R', 'Rook'], ['B', 'Bishop'], ['N', 'Knight']]
      : [['q', 'Queen'], ['r', 'Rook'], ['b', 'Bishop'], ['n', 'Knight']];

    for (const [pc, name] of pieces) {
      const btn = document.createElement("div");
      btn.className = "promo-choice";
      btn.title = name;
      const img = document.createElement("img");
      img.src = PIECE_IMAGES[pc];
      img.alt = name;
      btn.appendChild(img);
      btn.addEventListener("click", () => {
        const promoChar = pc.toLowerCase(); // q, r, b, n
        applyMove(pendingPromoFrom + pendingPromoTo + promoChar);
        selectedSq = null;
        legalMoves = [];
        pendingPromoFrom = null;
        pendingPromoTo = null;
        overlay.remove();
      });
      choices.appendChild(btn);
    }

    dialog.appendChild(choices);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);

    // Close on clicking outside dialog
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) {
        overlay.remove();
        pendingPromoFrom = null;
        pendingPromoTo = null;
      }
    });
  }

  // --- Fetch legal moves from the engine for hint dots ---
  function fetchLegalMoves() {
    fetch("/api/legalmoves", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        fen: "startpos",
        moves: moveHistory
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.moves) {
        legalMoves = data.moves;
        renderBoard();
      }
    })
    .catch(() => { /* silently ignore — hints are optional */ });
  }

  function applyMove(uciMove) {
    if (gameOver) return;

    const fromCol = uciMove.charCodeAt(0) - 97;
    const fromRow = 8 - parseInt(uciMove[1]);
    const toCol = uciMove.charCodeAt(2) - 97;
    const toRow = 8 - parseInt(uciMove[3]);
    const promoChar = uciMove.length >= 5 ? uciMove[4] : null;

    const movingPiece = board[fromRow][fromCol];
    const targetPiece = board[toRow][toCol];
    let isCapture = !!targetPiece;

    // Castling rook movements
    if (movingPiece.toUpperCase() === 'K') {
      if (fromCol === 4 && toCol === 6) { // Kingside
        board[fromRow][5] = board[fromRow][7];
        board[fromRow][7] = '';
      } else if (fromCol === 4 && toCol === 2) { // Queenside
        board[fromRow][3] = board[fromRow][0];
        board[fromRow][0] = '';
      }
    }

    // En passant capture
    if (movingPiece.toUpperCase() === 'P' && toCol !== fromCol && !targetPiece) {
      // Diagonal pawn move to empty square = en passant
      board[fromRow][toCol] = ''; // remove captured pawn
      isCapture = true;
    }

    // Track en passant target for next move
    if (movingPiece.toUpperCase() === 'P' && Math.abs(toRow - fromRow) === 2) {
      const epRow = (fromRow + toRow) / 2;
      enPassantSq = String.fromCharCode(97 + fromCol) + (8 - epRow);
    } else {
      enPassantSq = null;
    }

    // Pawn promotion
    let finalPiece = movingPiece;
    if (promoChar) {
      const promoMap = {
        'q': sideToMove === 'w' ? 'Q' : 'q',
        'r': sideToMove === 'w' ? 'R' : 'r',
        'b': sideToMove === 'w' ? 'B' : 'b',
        'n': sideToMove === 'w' ? 'N' : 'n'
      };
      finalPiece = promoMap[promoChar] || finalPiece;
    } else {
      if (movingPiece === 'P' && toRow === 0) finalPiece = 'Q';
      if (movingPiece === 'p' && toRow === 7) finalPiece = 'q';
    }

    board[toRow][toCol] = finalPiece;
    board[fromRow][fromCol] = '';

    playSound(isCapture ? 'capture' : 'move');

    lastMove = { from: uciMove.substring(0, 2), to: uciMove.substring(2, 4) };
    moveHistory.push(uciMove);
    historyPly++;
    sideToMove = (sideToMove === 'w') ? 'b' : 'w';

    document.getElementById("turnIndicator").innerText = (sideToMove === 'w') ? "White to Move" : "Black to Move";

    renderBoard();
    updateMoveHistoryUI();
    updateFenUI();
    fetchLegalMoves();

    // Auto-reply with ChessMinds if enabled
    if (document.getElementById("chkAutoEngine").checked && sideToMove === 'b') {
      setTimeout(() => requestEngineMove(false), 200);
    }
  }

  function requestEngineMove(manual) {
    if (gameOver) return;
    const depth = parseInt(document.getElementById("rngDepth").value) || 6;
    setEngineStatus("Thinking...", true);

    fetch("/api/move", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        fen: "startpos",
        moves: moveHistory,
        depth: depth
      })
    })
    .then(res => res.json())
    .then(data => {
      setEngineStatus("Engine Ready", false);
      if (data.bestmove && data.bestmove !== "(none)") {
        document.getElementById("statDepth").innerText = data.depth;
        document.getElementById("statNps").innerText = (data.nps || 0).toLocaleString();
        document.getElementById("statBestMove").innerText = data.bestmove;
        document.getElementById("statPv").innerText = data.pv || data.bestmove;

        // Update the vertical evaluation bar
        updateEvalBar(data.score || 0);

        applyMove(data.bestmove);
      } else if (data.gameover || data.bestmove === "(none)") {
        // Game over
        showGameResult(data);
      }
    })
    .catch(err => {
      setEngineStatus("Offline (Check server.py)", false);
      console.error(err);
    });
  }

  function showGameResult(data) {
    gameOver = true;
    const boardArea = document.querySelector('.board-area');
    const banner = document.createElement("div");
    banner.className = "game-result-banner";

    let title = "Game Over";
    let subtitle = "";

    if (data.result === "checkmate") {
      const winner = sideToMove === 'w' ? "Black" : "White";
      title = "Checkmate!";
      subtitle = `${winner} wins`;
    } else if (data.result === "stalemate") {
      title = "Stalemate";
      subtitle = "Draw by stalemate";
    } else {
      title = "Game Over";
      subtitle = data.result || "No legal moves";
    }

    banner.innerHTML = `<h2>${title}</h2><p>${subtitle}</p>`;
    boardArea.style.position = "relative";
    boardArea.appendChild(banner);
  }

  function setEngineStatus(text, busy) {
    const dot = document.getElementById("engineStatusDot");
    dot.className = "status-indicator" + (busy ? " busy" : "");
    document.getElementById("engineStatusText").innerText = text;
  }

  function updateMoveHistoryUI() {
    const box = document.getElementById("moveHistory");
    box.innerHTML = "";
    for (let i = 0; i < moveHistory.length; i += 2) {
      const moveNum = Math.floor(i / 2) + 1;
      const numSpan = document.createElement("span");
      numSpan.className = "move-num";
      numSpan.innerText = moveNum + ".";

      const wSpan = document.createElement("span");
      wSpan.className = "move-item" + (i === moveHistory.length - 1 ? " active" : "");
      wSpan.innerText = moveHistory[i];

      box.appendChild(numSpan);
      box.appendChild(wSpan);

      if (i + 1 < moveHistory.length) {
        const bSpan = document.createElement("span");
        bSpan.className = "move-item" + (i + 1 === moveHistory.length - 1 ? " active" : "");
        bSpan.innerText = moveHistory[i + 1];
        box.appendChild(bSpan);
      }
    }
    box.scrollTop = box.scrollHeight;
  }

  function updateFenUI() {
    let fen = "";
    for (let r = 0; r < 8; ++r) {
      let empty = 0;
      for (let c = 0; c < 8; ++c) {
        const p = board[r][c];
        if (!p) empty++;
        else {
          if (empty > 0) { fen += empty; empty = 0; }
          fen += p;
        }
      }
      if (empty > 0) fen += empty;
      if (r < 7) fen += "/";
    }
    fen += ` ${sideToMove} - - 0 1`;
    document.getElementById("fenInput").value = fen;
  }

  function copyFen() {
    const fen = document.getElementById("fenInput").value;
    navigator.clipboard.writeText(fen);
    alert("FEN copied to clipboard!");
  }

  function toggleFlip() {
    isFlipped = !isFlipped;
    renderBoard();
  }

  function updateDepthLabel() {
    document.getElementById("lblDepth").innerText = document.getElementById("rngDepth").value;
  }

  function newGame() {
    // Remove game result banner if visible
    const banner = document.querySelector('.game-result-banner');
    if (banner) banner.remove();
    initBoard();
  }

  function undoMove() {
    if (moveHistory.length === 0) return;
    gameOver = false;
    const banner = document.querySelector('.game-result-banner');
    if (banner) banner.remove();
    moveHistory.pop();
    const saved = [...moveHistory];
    initBoard();
    saved.forEach(m => applyMove(m));
  }

  function navFirst() { while (moveHistory.length > 0) undoMove(); }
  function navPrev() { undoMove(); }
  function navNext() { /* PGN navigation */ }
  function navLast() { /* Latest */ }

  // Startup
  initBoard();
</script>
